name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

# The repo is a single Android app: no Node/pnpm step anywhere, because there
# is no JS workspace left to lint, typecheck or bundle into the APK.
jobs:
  android-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android JVM tests and debug assemble
        run: |
          cd apps/android-tv-host
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Upload Android host artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host
          path: |
            apps/android-tv-host/app/build/outputs/apk/debug/*.apk
            apps/android-tv-host/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
