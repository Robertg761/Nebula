name: Bug report
description: Report a reproducible Nebula behavior or compatibility defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include TMDB keys, addon/debrid URLs, stream URLs, pairing URLs,
        or unredacted logcat. Security issues belong in private reporting.
  - type: input
    id: version
    attributes:
      label: Nebula version
      description: Shown at the top of Settings.
      placeholder: 0.6.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV / streamer and Android version
      placeholder: Google TV Streamer, Android 14 / API 34
    validations:
      required: true
  - type: input
    id: remote
    attributes:
      label: Remote / audio / display setup
      description: Include HDMI-CEC, AVR, Bluetooth, HDR, or passthrough details when relevant.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Press ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Link a short recording or reviewed log excerpt. Do not paste credentials.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I reviewed this report and its attachments for credentials and private URLs.
          required: true
