org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Build-time only; neither affects the produced artifact. Parallel execution is safe
# here because :app and :baselineprofile are the only projects and their dependency
# edge is declared. Caching is opt-in per task, so tasks that are not relocatable
# simply keep re-running.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Gradle's connected-test cleanup normally uninstalls the target APK. On a physical TV that also
# deletes the app's private DataStore after the tests' in-process cleanup has restored it. Retain
# connected-test APKs by default; the isolated emulator wrapper destroys its whole temporary AVD,
# while physical runs must additionally use scripts/run-tv-instrumentation-physical.sh so an
# external snapshot can recover from an ADB disconnect or instrumentation-process death.
android.injected.androidTest.leaveApksInstalledAfterTest=true
