// Classes the Compose compiler must treat as stable but cannot prove are, because they
// are declared outside this module and carry no @Stable/@Immutable marker.
//
// kotlin.collections.* covers List/Set/Map, which the compiler otherwise infers as
// unstable (the read-only interfaces are implemented by mutable classes). Every
// collection reaching a composable here is produced by the ViewModel and replaced
// wholesale on change; none is mutated in place behind a held reference. Without this,
// any composable taking a List re-executes on every recomposition of its parent.
kotlin.collections.*

// java.time value types (Duration, LocalDate, ZonedDateTime, Instant) are immutable by
// contract and are passed straight into details/diagnostics UI.
java.time.*
